name: ci

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        otp:
          - "27"
          - "26"
          - "25"
        elixir:
          - "1.20.1"
          - "1.19.5"
          - "1.18.4"
          - "1.17.3"
          - "1.16.3"
        exclude:
          - elixir: "1.20.1"
            otp: "26"
          - elixir: "1.20.1"
            otp: "25"
          - elixir: "1.19.5"
            otp: "25"
          - elixir: "1.16.3"
            otp: "27"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            _build
            deps
            vendor
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
